<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Logo Motion · FAKE CHURCH</title>
<meta name="description" content="FAKE CHURCH logo motion: a grotesque wordmark turns into the blackletter mark and back, in ten studies: melt × resolve, split, resolve, melt, wave, counter, wave × counter, interlace, blade, cursor and random.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=EB+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --ink: #f2efe6; --dim: rgba(242,239,230,.45); --red: #c41e1e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: "EB Garamond", Garamond, serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .ui {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 18px 24px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  }
  .ui div { display: flex; gap: 8px; flex-wrap: wrap; }
  .ui .sep { width: 1px; background: rgba(242,239,230,.18); margin: 0 6px; }
  .ui button {
    background: none; border: 1px solid rgba(242,239,230,.18); color: var(--ink); cursor: pointer;
    font: inherit; letter-spacing: inherit; padding: 8px 12px;
  }
  .ui button:hover { border-color: var(--ink); }
  .ui button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .ui .rec[data-on] { border-color: var(--red); color: var(--red); }
  body.clean .ui { display: none; }
  @media (max-width: 760px) { .ui { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<canvas id="c" aria-label="FAKE CHURCH logo animation: a sans-serif wordmark turns into the blackletter logo and back"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="ui">
  <span id="phase">Fake Church · Logo Motion</span>
  <div>
    <button data-mode="meltresolve" aria-pressed="true" title="Key 1">1 Melt × Resolve</button>
    <button data-mode="split" aria-pressed="false" title="Key 2">2 Split</button>
    <button data-mode="resolve" aria-pressed="false" title="Key 3">3 Resolve</button>
    <button data-mode="melt" aria-pressed="false" title="Key 4">4 Melt</button>
    <button data-mode="wave" aria-pressed="false" title="Key 5">5 Wave</button>
    <button data-mode="counter" aria-pressed="false" title="Key 6">6 Counter</button>
    <button data-mode="wavecounter" aria-pressed="false" title="Key 7">7 Wave × Counter</button>
    <button data-mode="interlace" aria-pressed="false" title="Key 8">8 Interlace</button>
    <button data-mode="blade" aria-pressed="false" title="Key 9">9 Blade</button>
    <button data-mode="cursor" aria-pressed="false" title="Key 0">0 Cursor</button>
    <button data-mode="random" aria-pressed="false" title="Key R">R Random</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="pause" aria-pressed="false">Pause</button>
    <button id="clean" title="Hide this bar (press H to bring it back)">Hide UI</button>
    <button id="rec" class="rec">Record loop</button>
  </div>
</div>

<script>
(() => {
  const MODES = ["meltresolve", "split", "resolve", "melt", "wave", "counter", "wavecounter", "interlace", "blade", "cursor", "random"];
  const NAMES = {
    meltresolve: "Melt × Resolve", split: "Split", resolve: "Resolve", melt: "Melt", wave: "Wave", counter: "Counter",
    wavecounter: "Wave × Counter", interlace: "Interlace", blade: "Blade", cursor: "Cursor", random: "Random",
  };
  const STEP = 12;                                   // digital moments run at 12 fps
  const WORD = "FAKE CHURCH";
  const INK = "#f2efe6", BG = "#000";
  // where the blackletter lowercase body sits in the mark, measured from the artwork
  const BODY_TOP = .374, BODY_BASE = .781, SEAM = (BODY_TOP + BODY_BASE) / 2;
  // horizontal extent of "Fake" and "Church" in the mark, as fractions of its width
  const WORDS = [["FAKE", .03, .372], ["CHURCH", .458, .985]];
  const TRACK = -.14;                                // grotesque tracking, in em

  /* Timelines in seconds. A = grotesque, B = blackletter. */
  const SWAP = [                                     // melt, resolve, melt × resolve
    { kind: "hold", show: "A", d: 2.4 },
    { kind: "go", from: "A", to: "B", d: 1.2 },
    { kind: "hold", show: "B", d: 3.0 },
    { kind: "go", from: "B", to: "A", d: 1.2 },
  ];
  // Split: a state is `top` above the cut and `bot` below (s = cut position, .5 = the middle).
  // A move wipes downward from one state to the next, so both faces always share the mark.
  const BA = { top: "B", bot: "A", s: .5 }, AB = { top: "A", bot: "B", s: .5 };
  const SPLIT = [
    { kind: "seam", from: BA, to: BA, d: 1.5 },              // blackletter over grotesque
    { kind: "seam", from: BA, to: AB, d: .8, move: true },
    { kind: "seam", from: AB, to: AB, d: 1.5 },              // grotesque over blackletter
    { kind: "seam", from: AB, to: BA, d: .8, move: true },
  ];
  // Wave, Counter, Wave × Counter: every letter column keeps its own cut (bTop = blackletter above it).
  // A flip wipes one letter to the other state: [start, duration, dir], dir 1 = downward, -1 = upward.
  const LETTER_PLANS = {
    wave: {                                          // a ripple left to right, back right to left
      L: 6.4, init: () => true,
      flips: i => [[.9 + i * .11, .55, 1], [4.0 + (9 - i) * .09, .5, -1]],
    },
    counter: {                                       // FAKE and CHURCH always opposite, crossing together
      L: 5.6, init: i => i < 4,
      flips: i => [[1.4, .7, i < 4 ? 1 : -1], [4.2, .7, i < 4 ? -1 : 1]],
    },
    wavecounter: {                                   // opposite words; the ripples meet in the gap, then part
      L: 6.4, init: i => i < 4,
      flips: i => {
        const meet = i < 4 ? i * .16 : (9 - i) * .1, part = i < 4 ? (3 - i) * .16 : (i - 4) * .1;
        return [[1.0 + meet, .5, i < 4 ? 1 : -1], [3.9 + part, .5, i < 4 ? -1 : 1]];
      },
    },
  };
  // Interlace: [strips, blackletter on the strip above the cut, seconds]; an irregular breath
  const INTERLACE = [
    [2, true, 1.3], [4, true, .45], [8, true, .3], [16, true, .22], [8, false, .28], [4, false, .4],
    [2, false, 1.3], [4, false, .45], [8, false, .3], [16, false, .22], [8, true, .28], [4, true, .4],
  ];
  // Blade: the cut turns about the gap between the words; [hold, spin] pairs, half a turn per spin
  const BLADE = [[2.1, .85], [1.5, .7]];
  const sum = a => a.reduce((x, y) => x + y, 0);
  const timeline = m => (m === "split" ? SPLIT : SWAP);
  const loopLen = m =>
    LETTER_PLANS[m] ? LETTER_PLANS[m].L :
    m === "interlace" ? sum(INTERLACE.map(x => x[2])) :
    m === "blade" ? sum(BLADE.flat()) * 2 :
    m === "cursor" ? 8 :
    timeline(m).reduce((s, x) => s + x.d, 0);

  const params = new URLSearchParams(location.search);
  let mode = MODES.includes(params.get("mode")) ? params.get("mode") : "meltresolve";
  const FREEZE = parseFloat(params.get("t"));        // ?t=2.9 freezes the loop at that second

  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const logo = new Image();
  logo.src = "assets/img/wordmark.webp?v=5";

  const mk = () => document.createElement("canvas");
  const offA = mk(), offB = mk(), buf = mk(), comp = mk(), small = mk();
  let W = 0, H = 0, dpr = 1, box = null, COLS = [];

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.round(innerWidth * dpr);
    H = cv.height = Math.round(innerHeight * dpr);
    const ratio = logo.naturalHeight / logo.naturalWidth || .3;
    const bw = Math.min(W * .76, 1500 * dpr), bh = bw * ratio;
    box = { x: (W - bw) / 2, y: (H - bh) / 2, w: bw, h: bh };
    for (const o of [offA, offB, buf, comp]) { o.width = W; o.height = H; }
    drawA(); drawB();
  }

  /* ---------- the two states, on one baseline ----------
     The grotesque caps fill exactly the blackletter lowercase body,
     and the tracking is set so the line runs the width of the mark. */
  function drawA() {
    const c = offA.getContext("2d");
    c.clearRect(0, 0, W, H);
    const font = sz => `800 ${sz}px "Inter Tight", "Helvetica Neue", Arial, sans-serif`;
    c.font = font(100);
    const capRatio = (c.measureText("H").actualBoundingBoxAscent || 72.7) / 100;
    const size = (BODY_BASE - BODY_TOP) * box.h / capRatio;   // caps fill the blackletter body
    c.font = font(size);
    const track = TRACK * size;                      // one tracking for both words
    c.fillStyle = INK;
    const base = box.y + BODY_BASE * box.h;
    const centres = [];
    for (const [word, a, b] of WORDS) {              // each word centred on its blackletter counterpart
      const ws = [...word].map(ch => c.measureText(ch).width);
      const total = ws.reduce((x, y) => x + y, 0) + track * (word.length - 1);
      let x = box.x + ((a + b) / 2) * box.w - total / 2;
      [...word].forEach((ch, i) => { c.fillText(ch, x, base); centres.push(x + ws[i] / 2); x += ws[i] + track; });
    }
    // one column per letter, split halfway between neighbours, the outer ones running to the edges
    COLS = centres.map((x, i) => [
      i ? Math.round((centres[i - 1] + x) / 2) : 0,
      i < centres.length - 1 ? Math.round((x + centres[i + 1]) / 2) : W,
    ]);
  }
  function drawB() {
    const c = offB.getContext("2d");
    c.clearRect(0, 0, W, H);
    c.imageSmoothingQuality = "high";
    if (logo.naturalWidth) c.drawImage(logo, box.x, box.y, box.w, box.h);
  }

  /* ---------- building blocks, drawn into any context ---------- */
  // MELT: every column of the mark runs down like wax
  function melt(t, src, amt) {
    if (amt <= 0) { t.drawImage(src, 0, 0); return; }
    const col = Math.max(2, Math.round(2 * dpr));
    const x0 = Math.floor(box.x - box.w * .02), x1 = Math.ceil(box.x + box.w * 1.02);
    const y0 = Math.floor(box.y - box.h * .1), h0 = Math.round(box.h * 1.2);
    for (let x = x0; x < x1; x += col) {
      const u = (x - box.x) / box.w;
      const wave = .5 + .25 * Math.sin(u * 9.1 + 1.3) + .2 * Math.sin(u * 23.7 + 4.1);
      const drip = hash(Math.floor(u * 140)) > .86 ? 1.6 : 1;
      t.drawImage(src, x, y0, col + 1, h0, x, y0, col + 1, Math.round(h0 + h0 * amt * .9 * wave * drip));
    }
  }
  // RESOLVE: drop to 1-bit blocks of `block` px inside a horizontal region
  function pixelate(t, src, block, ry0 = box.y - box.h * .2, ry1 = box.y + box.h * 1.6,
                    rx0 = box.x - box.h * .2, rx1 = box.x + box.w + box.h * .2) {
    if (block < 1) { t.drawImage(src, 0, 0); return; }
    const sx = rx0, sw = rx1 - rx0, sy = ry0, sh = ry1 - ry0;
    const cw = Math.max(1, Math.round(sw / block)), ch = Math.max(1, Math.round(sh / block));
    small.width = cw; small.height = ch;
    const c = small.getContext("2d");
    c.clearRect(0, 0, cw, ch);
    c.drawImage(src, sx, sy, sw, sh, 0, 0, cw, ch);
    try {
      const d = c.getImageData(0, 0, cw, ch), a = d.data;
      for (let i = 0; i < a.length; i += 4) { a[i] = 242; a[i + 1] = 239; a[i + 2] = 230; a[i + 3] = a[i + 3] > 92 ? 255 : 0; }
      c.putImageData(d, 0, 0);
    } catch (e) { /* opened from file://: keep the soft blocks */ }
    t.imageSmoothingEnabled = false;
    t.drawImage(small, 0, 0, cw, ch, sx, sy, sw, sh);
    t.imageSmoothingEnabled = true;
  }
  const LADDER = [0, 2, 4, 7, 11, 16, 22, 16, 11, 7, 4, 2, 0];   // block, in 1/100 of mark height
  const ladder = p => LADDER[clamp(Math.floor(p * LADDER.length), 0, LADDER.length - 1)] / 100 * box.h;

  /* ---------- transitions between A and B ---------- */
  function transition(from, to, local, dur) {
    const step = Math.floor(local * STEP);
    const pq = clamp(step / (dur * STEP), 0, 1);     // stepped progress
    const ps = clamp(local / dur, 0, 1);             // smooth progress
    if (mode === "resolve") {
      pixelate(ctx, pq < .5 ? from : to, ladder(pq));
    } else if (mode === "melt") {
      melt(ctx, ps < .5 ? from : to, easeOut(Math.sin(Math.PI * ps)));
    } else {
      // melt x resolve: it runs, at the deepest run it breaks into blocks and turns over
      const b = buf.getContext("2d");
      b.clearRect(0, 0, W, H);
      melt(b, ps < .5 ? from : to, easeOut(Math.sin(Math.PI * ps)) * .75);
      const mid = 1 - Math.abs(pq - .5) * 2;          // 0 at the ends, 1 in the middle
      pixelate(ctx, buf, mid > .35 ? ladder(pq) : 0);
    }
  }

  /* ---------- split: the two faces cut together, the cut wiping downward ---------- */
  function split(f, local) {
    const step = Math.floor(local * STEP);
    const top = box.y - box.h * .06, cut = box.y + SEAM * box.h, bot = box.y + box.h * 1.06;
    const seamAt = v => Math.round(v <= .5 ? top + (cut - top) * (v / .5) : cut + (bot - cut) * ((v - .5) / .5));
    const q = f.move ? easeInOut(clamp(step / (f.d * STEP), 0, 1)) : 1;
    const w = f.move ? Math.round(top + (bot - top) * q) : H;
    const kick = f.move ? Math.sin(Math.PI * q) : 0;
    const dx = Math.round(kick * box.w * .012);
    const S = { A: offA, B: offB };
    const c = comp.getContext("2d");
    const rows = (src, y0, y1, ox) => { if (y1 > y0) c.drawImage(src, 0, y0, W, y1 - y0, ox, y0, W, y1 - y0); };
    const state = (st, y0, y1, ox) => {
      const ys = seamAt(st.s);
      rows(S[st.top], y0, Math.min(y1, ys), ox);
      rows(S[st.bot], Math.max(y0, ys), y1, ox);
    };
    c.clearRect(0, 0, W, H);
    state(f.to, 0, w, -dx);
    state(f.from, w, H, dx);
    ctx.drawImage(comp, 0, 0);
    if (f.move) {                                    // travelling: the wipe breaks into coarse blocks
      const band = box.h * .16;
      ctx.fillStyle = BG; ctx.fillRect(0, w - band / 2, W, band);
      pixelate(ctx, comp, box.h * (.03 + .05 * kick), w - band / 2, w + band / 2);
      return "wiping";
    }
    return f.to.top === "B" ? "blackletter over grotesque" : "grotesque over blackletter";
  }

  /* ---------- shared cut geometry ---------- */
  const span = () => ({ top: box.y - box.h * .06, cut: Math.round(box.y + SEAM * box.h), bot: box.y + box.h * 1.06 });
  const slice = (c, src, x0, x1, y0, y1, ox = 0) => {
    if (x1 > x0 && y1 > y0) c.drawImage(src, x0, y0, x1 - x0, y1 - y0, x0 + ox, y0, x1 - x0, y1 - y0);
  };

  // Random: every letter starts the right or the wrong way up and turns over at its own moments.
  // Two or four turns each, so the 12 s loop closes on itself and can be recorded.
  LETTER_PLANS.random = (() => {
    const L = 12, plans = [];
    for (let i = 0; i < 10; i++) {
      const n = hash(i * 7.3 + 1) > .4 ? 4 : 2, slot = L / n, ev = [];
      for (let k = 0; k < n; k++) {
        const d = .4 + hash(i * 3.1 + k * 5.7) * .4;
        ev.push([k * slot + .3 + hash(i * 11.9 + k * 2.3) * (slot - d - .6), d, hash(i * 4.4 + k * 9.1) > .5 ? 1 : -1]);
      }
      plans.push({ init: hash(i * 2.9 + 3.3) > .5, ev });
    }
    return { L, init: i => plans[i].init, flips: i => plans[i].ev };
  })();

  /* ---------- wave / counter / random: a cut per letter ---------- */
  function letterState(i, t, plan) {
    let top = plan.init(i);
    for (const [s0, d, dir] of plan.flips(i)) {
      if (t < s0) break;
      if (t < s0 + d) return { from: top, to: !top, local: t - s0, d, dir };
      top = !top;
    }
    return { from: top, to: top };
  }
  function letters(plan, t) {
    const { top, cut, bot } = span();
    const c = comp.getContext("2d");
    c.clearRect(0, 0, W, H);
    const bands = [];
    COLS.forEach(([x0, x1], i) => {
      const st = letterState(i, t, plan);
      let w = H, up = st.to, lo = st.to, kick = 0;
      if (st.d) {
        const q = easeInOut(clamp(Math.floor(st.local * STEP) / (st.d * STEP), 0, 1));
        kick = Math.sin(Math.PI * q);
        if (st.dir > 0) { w = Math.round(top + (bot - top) * q); up = st.to; lo = st.from; }
        else { w = Math.round(bot - (bot - top) * q); up = st.from; lo = st.to; }
        bands.push([x0, x1, w, kick]);
      }
      const dx = Math.round(kick * box.w * .006);
      const rows = (bTop, y0, y1, ox) => {
        slice(c, bTop ? offB : offA, x0, x1, y0, Math.min(y1, cut), ox);
        slice(c, bTop ? offA : offB, x0, x1, Math.max(y0, cut), y1, ox);
      };
      rows(up, 0, w, -dx);
      rows(lo, w, H, dx);
    });
    ctx.drawImage(comp, 0, 0);
    const band = box.h * .14;
    ctx.fillStyle = BG;
    for (const [x0, x1, w, kick] of bands) {         // each travelling cut breaks into coarse blocks
      ctx.fillRect(x0, w - band / 2, x1 - x0, band);
      pixelate(ctx, comp, box.h * (.025 + .04 * kick), w - band / 2, w + band / 2, x0, x1);
    }
    return bands.length ? "turning" : "held";
  }

  /* ---------- interlace: the cut multiplies into strips ---------- */
  function interlace(t) {
    const { top, cut, bot } = span();
    let acc = 0, k = 0;
    while (k < INTERLACE.length - 1 && t >= acc + INTERLACE[k][2]) acc += INTERLACE[k++][2];
    const [n, bTop] = INTERLACE[k], local = t - acc;
    const sh = (bot - top) / n;
    const settle = clamp(1 - Math.floor(local * STEP) / 3, 0, 1);   // a short jolt on every change
    const c = comp.getContext("2d");
    c.clearRect(0, 0, W, H);
    for (let j = Math.floor(-cut / sh) - 1; j <= Math.ceil((H - cut) / sh); j++) {
      const y0 = Math.round(cut + j * sh), y1 = Math.round(cut + (j + 1) * sh);
      const odd = ((j % 2) + 2) % 2 === 1;           // j = -1 is the strip just above the cut
      const ox = Math.round((odd ? -1 : 1) * settle * box.w * .01);
      slice(c, odd === bTop ? offB : offA, 0, W, Math.max(0, y0), Math.min(H, y1), ox);
    }
    ctx.drawImage(comp, 0, 0);
    return `${n} strips`;
  }

  /* ---------- blade: a turning cut (blackletter on one side of the line) ---------- */
  function halfPlanes(cx, cy, phi, slide, flipped) {
    const L = (W + H) * 2, dX = Math.cos(phi), dY = Math.sin(phi), nX = -dY, nY = dX;
    const sideB = flipped ? 1 : -1;
    const c = comp.getContext("2d");
    c.clearRect(0, 0, W, H);
    for (const [side, src, k] of [[sideB, offB, slide], [-sideB, offA, -slide]]) {
      c.save();
      c.beginPath();
      c.moveTo(cx + dX * L, cy + dY * L);
      c.lineTo(cx - dX * L, cy - dY * L);
      c.lineTo(cx - dX * L + nX * L * side, cy - dY * L + nY * L * side);
      c.lineTo(cx + dX * L + nX * L * side, cy + dY * L + nY * L * side);
      c.closePath();
      c.clip();
      c.drawImage(src, Math.round(dX * k), Math.round(dY * k));
      c.restore();
    }
    ctx.drawImage(comp, 0, 0);
  }
  const GAP = .415;                                  // the space between FAKE and CHURCH, across the mark
  function blade(t) {
    const { cut } = span();
    const seq = [...BLADE, ...BLADE];
    let acc = 0, turns = 0;
    for (const [hold, spin] of seq) {
      if (t < acc + hold) {                          // resting: a slow, slight tilt
        const u = (t - acc) / hold;
        halfPlanes(box.x + GAP * box.w, cut, turns * Math.PI + .07 * Math.sin(u * Math.PI * 2), 0, false);
        return turns % 2 ? "grotesque over blackletter" : "blackletter over grotesque";
      }
      acc += hold;
      if (t < acc + spin) {
        const q = easeInOut((t - acc) / spin);
        halfPlanes(box.x + GAP * box.w, cut, (turns + q) * Math.PI, Math.sin(Math.PI * q) * box.w * .02, false);
        return "turning";
      }
      acc += spin; turns++;
    }
    halfPlanes(box.x + GAP * box.w, cut, 0, 0, false);
    return "blackletter over grotesque";
  }

  /* ---------- cursor: the cut follows the pointer; click swaps the faces ---------- */
  const pointer = { x: .5, y: .5, at: -1e9 }, cur = { y: null, a: 0 };
  let swapped = false, swapAt = -1e9;
  addEventListener("pointermove", e => { pointer.x = e.clientX / innerWidth; pointer.y = e.clientY / innerHeight; pointer.at = performance.now(); });
  cv.addEventListener("pointerdown", () => { if (mode === "cursor") { swapped = !swapped; swapAt = performance.now(); } });
  function cursor(now) {
    const { top, cut, bot } = span();
    const idle = now - pointer.at > 2200;
    const ty = idle ? cut + Math.sin(now / 1400) * box.h * .16 : top + clamp(pointer.y, 0, 1) * (bot - top);
    const ta = idle ? Math.sin(now / 2300) * .12 : (pointer.x - .5) * .7;
    if (cur.y === null) cur.y = cut;
    cur.y += (ty - cur.y) * .12;
    cur.a += (ta - cur.a) * .12;
    const jolt = clamp(1 - (now - swapAt) / 260, 0, 1);
    halfPlanes(box.x + GAP * box.w, cur.y, cur.a, Math.sin(Math.PI * jolt) * box.w * .02, swapped);
    return idle ? "idle · move the pointer, click to swap" : "following · click to swap";
  }

  /* ---------- clock ---------- */
  let start = performance.now(), paused = false, pausedAt = 0, lastLabel = "";
  const label = document.getElementById("phase");

  function frame(now) {
    const t = Number.isFinite(FREEZE) ? FREEZE : ((paused ? pausedAt : now) - start) / 1000;
    const L = loopLen(mode), lt = ((t % L) + L) % L;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    let phase;
    if (LETTER_PLANS[mode]) phase = letters(LETTER_PLANS[mode], lt);
    else if (mode === "interlace") phase = interlace(lt);
    else if (mode === "blade") phase = blade(lt);
    else if (mode === "cursor") phase = cursor(now);
    if (phase) {
      const text = `Fake Church · ${NAMES[mode]} · ${phase}`;
      if (text !== lastLabel) { label.textContent = text; lastLabel = text; }
      requestAnimationFrame(frame);
      return;
    }
    let acc = 0, seg = timeline(mode)[0], local = 0;
    for (const f of timeline(mode)) { if (lt < acc + f.d) { seg = f; local = lt - acc; break; } acc += f.d; }
    const S = { A: offA, B: offB };
    if (seg.kind === "hold") { ctx.drawImage(S[seg.show], 0, 0); phase = seg.show === "A" ? "grotesque" : "blackletter"; }
    else if (seg.kind === "go") { transition(S[seg.from], S[seg.to], local, seg.d); phase = seg.to === "B" ? "→ blackletter" : "→ grotesque"; }
    else phase = split(seg, local);

    const text = `Fake Church · ${NAMES[mode]} · ${phase}`;
    if (text !== lastLabel) { label.textContent = text; lastLabel = text; }
    requestAnimationFrame(frame);
  }

  /* ---------- controls ---------- */
  const modeBtns = [...document.querySelectorAll("[data-mode]")];
  function setMode(m) {
    mode = m;
    modeBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    const u = new URL(location); u.searchParams.set("mode", m); history.replaceState(null, "", u);
  }
  modeBtns.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  setMode(mode);

  const pauseBtn = document.getElementById("pause");
  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    if (paused) pausedAt = performance.now(); else start += performance.now() - pausedAt;
    pauseBtn.setAttribute("aria-pressed", paused);
    pauseBtn.textContent = paused ? "Play" : "Pause";
  });
  document.getElementById("clean").addEventListener("click", () => document.body.classList.add("clean"));
  addEventListener("keydown", e => {
    const i = "1234567890".indexOf(e.key);
    if (i >= 0) setMode(MODES[i]);
    if (e.key === "r" || e.key === "R") setMode("random");
    if (e.key === "h" || e.key === "H") document.body.classList.toggle("clean");
    if (e.key === " ") { e.preventDefault(); pauseBtn.click(); }
  });

  // record exactly one loop of the current mode, from the top, as WebM
  const recBtn = document.getElementById("rec");
  recBtn.addEventListener("click", () => {
    if (!window.MediaRecorder || !cv.captureStream) { recBtn.textContent = "Not supported"; return; }
    const stream = cv.captureStream(60);
    const type = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
      a.download = `fake-church-logo-${mode}.webm`;
      a.click();
      recBtn.textContent = "Record loop"; delete recBtn.dataset.on;
    };
    if (paused) pauseBtn.click();
    start = performance.now();
    rec.start();
    recBtn.textContent = "Recording…"; recBtn.dataset.on = "";
    setTimeout(() => rec.stop(), loopLen(mode) * 1000 + 60);
  });

  /* ---------- go ---------- */
  addEventListener("resize", layout);
  Promise.all([
    new Promise(res => logo.complete && logo.naturalWidth ? res() : (logo.onload = res, logo.onerror = res)),
    document.fonts ? document.fonts.load('800 100px "Inter Tight"').catch(() => {}) : null,
  ]).then(() => { layout(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
